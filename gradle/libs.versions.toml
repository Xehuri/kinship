[versions]
agp = "8.6.1"
kotlin = "2.0.0"
composeBom = "2024.12.01"
coreKtx = "1.13.1"
activityCompose = "1.9.3"
lifecycleRuntime = "2.8.7"
navigationCompose = "2.8.5"
junitJupiter = "5.11.4"
mockk = "1.13.14"
truth = "1.4.4"
robolectric = "4.14.1"
timber = "5.0.1"
composeUiTest = "1.7.6"
shizuku = "13.1.5"
okhttp = "4.12.0"
securityCrypto = "1.1.0-alpha06"
coreSplashscreen = "1.0.1"
sherpaOnnx = "v1.13.8"
streamWebrtc = "1.3.10"
glance = "1.2.0"
work = "2.9.1"

[libraries]
# Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose BOM
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Lifecycle
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntime" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntime" }

# Navigation
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Testing
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junitJupiter" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junitJupiter" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

# Shizuku
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }

# OkHttp
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# Security
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# sherpa-onnx（端侧 KWS；未发布到 Maven Central，经 JitPack 解析）
sherpa-onnx = { group = "com.github.k2-fsa.sherpa-onnx", name = "sherpa-onnx", version.ref = "sherpaOnnx" }
sherpa-onnx-jvm = { group = "com.github.k2-fsa.sherpa-onnx", name = "sherpa-onnx-jvm", version.ref = "sherpaOnnx" }
sherpa-onnx-native-lib-win-x64 = { group = "com.github.k2-fsa.sherpa-onnx", name = "sherpa-onnx-native-lib-win-x64", version.ref = "sherpaOnnx" }

# WebRTC DataChannel（Phase 2 音频/感知旁路；仅公共 STUN，无 TURN）
stream-webrtc-android = { group = "io.getstream", name = "stream-webrtc-android", version.ref = "streamWebrtc" }

# Glance 桌面组件（widget demo 第一/二波，全 Glance 路线，不走经典 RemoteViews）。
# 2026-10-13 升 1.1.1 → 1.2.0（稳定版，2026-08-26 发布）：1.2.0 主体是预览体系
# （composeForPreview / setWidgetPreviews @API33+）+ 性能与修复；样式/交互 API 面与
# 1.1.1 逐项一致（官方 sources jar 比对），现有 widget 代码零改动。minSdk 21→23（项目 26 无感）。
# 前置条件：glance-appwidget 1.2.0 的 aar-metadata 实测要求 AGP 8.6.0+（checkDebugAarMetadata
# 强制项 minAndroidGradlePluginVersion=8.6.0），故同批把工具链 AGP 8.5.0 → 8.6.1。
glance = { group = "androidx.glance", name = "glance", version.ref = "glance" }
glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }

# WorkManager（第二波轮询通道在用；维持 2.9.1——当初钉低版本是为绕 AGP 8.6 门槛，该门槛已随
# 本次 AGP 8.6.1 升级解除，但 2.12 无功能需求，不为升而升、控制影响面；work-runtime-ktx 2.9.1
# 为空壳重定位包，实际 API 全在 work-runtime 本体，经 POM 传递引入）
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
