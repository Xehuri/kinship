# Host-level Kinship rows inserted by this bundle.
#
# The bridge is one loopback HTTP endpoint over the live dsh agent registry.
# It binds at most one root Session whose preset is `kinship`; the preset itself
# is declared in presets/kinship.patch.yml.
#
# The UI row carries only a browser module: the Kinship page in the Web sidebar.
# It is a separate row on purpose, because saving bridge configuration reloads
# the bridge row and the panel must outlive that reload.
- insert:
    - id: kinship-bridge
      name: 'kinship-bridge'
      config:
        host: !!js process.env.KINSHIP_BRIDGE_HOST ?? '127.0.0.1'
        port: !!js Number(process.env.KINSHIP_BRIDGE_PORT ?? 18765)
        tokenEnv: KINSHIP_BRIDGE_TOKEN
        tokenFile: !!js process.env.KINSHIP_BRIDGE_TOKEN_FILE ?? ''
        policy: !!js process.env.KINSHIP_BRIDGE_POLICY ?? 'first'
        sessionId: !!js process.env.KINSHIP_BRIDGE_SESSION_ID ?? ''
        rebindOnMissing: !!js process.env.KINSHIP_BRIDGE_REBIND_ON_MISSING === '1'
        bodyLimitBytes: 65536
    - id: kinship-ui
      name: 'kinship-ui'
    - id: kinship-plan-scheduler
      name: 'kinship-plan-scheduler'
      config:
        planRoot: !!js process.env.KINSHIP_PLAN_ROOT ?? ''
        stateDir: !!js process.env.KINSHIP_PLAN_STATE_DIR ?? ''
        mode: !!js process.env.KINSHIP_PLAN_MODE ?? 'live'
        timezone: !!js process.env.KINSHIP_PLAN_TIMEZONE ?? 'Asia/Shanghai'
        anchors: !!js (process.env.KINSHIP_PLAN_ANCHORS ?? '').split(',').filter(Boolean)
        watchdogMs: !!js Number(process.env.KINSHIP_PLAN_WATCHDOG_MS ?? 60000)
        horizonHours: !!js Number(process.env.KINSHIP_PLAN_HORIZON_HOURS ?? 48)
        catchupMaxAgeHours: !!js Number(process.env.KINSHIP_PLAN_CATCHUP_MAX_AGE_HOURS ?? 8)
        debtAfterHours: !!js Number(process.env.KINSHIP_PLAN_DEBT_AFTER_HOURS ?? 24)
