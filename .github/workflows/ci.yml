name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/requirements.txt
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Compile backend sources
        run: python -m compileall -q backend

  frontend:
    name: Frontend typecheck, unit, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build Android debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kinship-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  loom:
    name: Loom typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loom-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: loom-harness/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  docs:
    name: Public docs and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/docs-check/check_docs.py all

  stratum-contract:
    name: Stratum contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      STRATUM_VERSION: v0.1.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Stratum
        run: python -m pip install "git+https://github.com/Xehuri/stratum.git@v0.1.1"
      - name: Validate prompt contract files
        run: python tools/check_stratum_prompts.py
      - name: Validate documented commands
        run: |
          python tools/check_stratum_commands.py --self-test
          python tools/check_stratum_commands.py
      - name: Validate legacy import script
        if: runner.os == 'Linux'
        run: |
          bash -n ai-template/scripts/import-legacy-index.sh
          root=$(mktemp -d)
          mkdir -p "$root/data/index"
          ai-template/scripts/import-legacy-index.sh "$root" --dry-run

  stratum-installer-windows:
    name: Stratum installer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "ai-template/scripts/install-stratum.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "PowerShell parse failed"
          }
      - name: Dry run
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "stratum-dry-ai"
          New-Item -ItemType Directory -Path $root | Out-Null
          ./ai-template/scripts/install-stratum.ps1 -AiRoot $root -Version v0.1.1 -NoProxy -DryRun -Force
      - name: Parse and dry-run legacy import
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "ai-template/scripts/import-legacy-index.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "PowerShell parse failed"
          }
          $root = Join-Path $env:RUNNER_TEMP "stratum-import-ai"
          New-Item -ItemType Directory -Path (Join-Path $root "data/index") -Force | Out-Null
          ./ai-template/scripts/import-legacy-index.ps1 -AiRoot $root -DryRun
      - name: Install and initialize
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "stratum-full-ai"
          New-Item -ItemType Directory -Path $root | Out-Null
          ./ai-template/scripts/install-stratum.ps1 -AiRoot $root -Version v0.1.1 -NoProxy -Force
          python -m stratum --version
          python -m stratum status
