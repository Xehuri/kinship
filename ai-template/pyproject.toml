[project]
name = "ai-mcp"
version = "1.0.0"
description = "MCP tools for the AI analysis system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    # mcp/ai_mcp.py 顶层 import yaml；master_plan_seed / plan_wake /
    # memory_index_query 与分析测试也会读 YAML，故保留 PyYAML。
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.scripts]
ai-mcp = "ai_mcp:mcp.run"
